<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f6f1">
    <title>Project Directory</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #202a26;
            --muted: #67736d;
            --paper: #f7f6f1;
            --line: #d7d9d1;
            --green: #244e40;
            --coral: #c45137;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background: var(--paper);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }

        main {
            width: min(100% - 48px, 1040px);
            margin: 0 auto;
            padding: 32px 0 40px;
        }

        .masthead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .masthead-mark {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: var(--green);
        }

        .masthead-mark::before {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--coral);
            content: "";
        }

        .hero {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 32px;
            padding: 66px 0 54px;
            animation: arrive 600ms ease-out both;
        }

        .eyebrow {
            margin: 0 0 15px;
            color: var(--coral);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 680px;
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 4.6rem;
            font-weight: 400;
            line-height: 0.98;
        }

        h1 em {
            color: var(--green);
            font-weight: 400;
        }

        .total {
            flex: 0 0 auto;
            padding: 0 0 4px 24px;
            border-left: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.76rem;
            line-height: 1.5;
            text-transform: uppercase;
        }

        .total strong {
            display: block;
            color: var(--coral);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 2.8rem;
            font-weight: 400;
            line-height: 1;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 14px;
        }

        h2 {
            margin: 0;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .section-rule {
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        ol {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        li {
            min-width: 0;
            animation: arrive 500ms ease-out both;
        }

        li:nth-child(2) { animation-delay: 70ms; }
        li:nth-child(3) { animation-delay: 140ms; }
        li:nth-child(4) { animation-delay: 210ms; }

        li a {
            position: relative;
            display: flex;
            min-height: 190px;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            padding: 22px;
            border: 1px solid transparent;
            border-radius: 4px;
            color: var(--ink);
            background: #e7eee6;
            text-decoration: none;
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        li:nth-child(2) a { background: #f0dfd4; }
        li:nth-child(3) a { background: #e8e5d7; }
        li:nth-child(4) a {
            color: #f7f6f1;
            background: var(--green);
        }

        li a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px #202a261a;
        }

        li a:focus-visible {
            outline: 3px solid var(--coral);
            outline-offset: 3px;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: var(--muted);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        li:nth-child(4) .card-meta { color: #b6c8bd; }

        .number {
            color: var(--coral);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1rem;
            letter-spacing: 0;
        }

        .card-bottom {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
        }

        .project-name {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 2rem;
            font-weight: 400;
            line-height: 1.05;
        }

        .arrow {
            display: grid;
            width: 36px;
            height: 36px;
            flex: 0 0 auto;
            place-items: center;
            border: 1px solid currentColor;
            border-radius: 50%;
            font-size: 1.1rem;
            transition: color 180ms ease, background 180ms ease, transform 180ms ease;
        }

        li a:hover .arrow {
            transform: rotate(45deg);
            color: var(--paper);
            background: var(--ink);
        }

        li:nth-child(4) a:hover .arrow {
            color: var(--green);
            background: var(--paper);
        }

        footer {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 28px;
            padding-top: 14px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            main {
                width: min(100% - 32px, 500px);
                padding-top: 22px;
            }

            .hero {
                align-items: flex-start;
                padding: 50px 0 38px;
            }

            h1 { font-size: 3.3rem; }

            .total {
                padding-left: 14px;
                font-size: 0.64rem;
            }

            .total strong { font-size: 2.2rem; }

            ol { gap: 10px; }

            li a {
                min-height: 160px;
                padding: 16px;
            }

            .project-name { font-size: 1.55rem; }

            .arrow {
                width: 30px;
                height: 30px;
            }
        }

        @media (max-width: 420px) {
            .hero { gap: 14px; }

            h1 { font-size: 2.65rem; }

            .total { padding-left: 10px; }

            ol { grid-template-columns: 1fr; }

            li a { min-height: 138px; }

            .project-name { font-size: 1.8rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <header class="masthead">
            <span class="masthead-mark">Web projects</span>
            <span>Directory / 2026</span>
        </header>

        <section class="hero" aria-labelledby="page-title">
            <div>
                <p class="eyebrow">A small collection</p>
                <h1 id="page-title">Made for the <em>web.</em></h1>
            </div>
            <div class="total"><strong>04</strong>projects</div>
        </section>

        <section aria-labelledby="directory-title">
            <div class="section-heading">
                <h2 id="directory-title">Browse projects</h2>
                <span class="section-rule" aria-hidden="true"></span>
            </div>
            <ol>
                <li>
                    <a href="calculator/index.html">
                        <span class="card-meta"><span class="number">01</span><span>Utility</span></span>
                        <span class="card-bottom"><span class="project-name">Calculator</span>
                        <span class="arrow" aria-hidden="true">&#8599;</span>
                        </span>
                    </a>
                </li>
                <li>
                    <a href="login/index.html">
                        <span class="card-meta"><span class="number">02</span><span>Interface</span></span>
                        <span class="card-bottom"><span class="project-name">Login Form</span>
                        <span class="arrow" aria-hidden="true">&#8599;</span>
                        </span>
                    </a>
                </li>
                <li>
                    <a href="student_profile.html">
                        <span class="card-meta"><span class="number">03</span><span>Profile</span></span>
                        <span class="card-bottom"><span class="project-name">Student Profile</span>
                        <span class="arrow" aria-hidden="true">&#8599;</span>
                        </span>
                    </a>
                </li>
                <li>
                    <a href="super_mario.html">
                        <span class="card-meta"><span class="number">04</span><span>Game</span></span>
                        <span class="card-bottom"><span class="project-name">Super Mario</span>
                        <span class="arrow" aria-hidden="true">&#8599;</span>
                        </span>
                    </a>
                </li>
            </ol>
        </section>

        <footer><span>Personal projects</span><span>HTML / CSS / JS</span></footer>
    </main>
</body>
</html>
